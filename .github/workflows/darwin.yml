# Build the darwin binaries on a Mac.  These targets need the Apple
# SDK headers (mach, CoreFoundation, IOKit) which zig does not
# bundle.  The zig cc wrappers in build/zig/ locate the SDK
# automatically with `xcrun --show-sdk-path` when building on a Mac.
name: Darwin Build All Arches
on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: github.event.pull_request.merged || github.event_name == 'workflow_dispatch'
    name: Build
    runs-on: macos-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go 1.26
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version: '^1.26'

        # Caching seems to really slow down the build due to the time
        # taken to save the cache.
        cache: false

    - run: go version

    - name: Install zig
      run: |
        ./build/zig/setup.sh

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e

    - name: npm install gui
      run: |
            cd gui/velociraptor/
            npm install
            npm run build
            cd ../../

    - name: Build Darwin Binaries
      run: |
        mkdir ./output/
        export PATH=$PATH:~/go/bin/:$GITHUB_WORKSPACE/build/zig
        go run make.go -v UpdateDependentTools
        go run make.go -v Darwin
        go run make.go -v DarwinM1

    - name: StoreBinaries
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
      with:
        name: Binaries
        path: output